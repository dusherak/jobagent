<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><i></i><span>Job Agent</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="home">Home</button>
      <button data-tab="jobs">Jobs</button>
      <button data-tab="apps">Applications<span class="badge" id="appsBadge" hidden></span></button>
      <button data-tab="docs">Documents</button>
      <button data-tab="live">Live<span class="live-dot" id="liveDot" hidden></span></button>
    </nav>
    <span class="grow"></span>
    <span class="task-pill" id="taskPill"></span>
    <button class="icon-btn" id="themeBtn" title="Theme"></button>
  </div>
</header>

<main>
  <section class="page" id="pg-home"></section>

  <section class="page" id="pg-jobs">
    <div class="page-head">
      <div><h1>Jobs</h1><p class="sub" id="jobsSub">Roles posted in the last 14 days.</p></div>
      <button class="btn primary" id="updateJobs"></button>
    </div>
    <div class="toolbar">
      <div class="search"><svg><use href="#i-search"/></svg><input id="jq" placeholder="Search roles, firms, places" autocomplete="off"><kbd>/</kbd></div>
      <select class="sel" id="jsort" title="Sort">
        <option value="rec">Recommended</option><option value="new">Newest</option><option value="deadline">Deadline</option>
      </select>
      <span class="grow"></span>
      <label class="check"><input type="checkbox" id="showDismissed"> Show dismissed</label>
    </div>
    <div class="toolbar"><div class="seg" id="jobSeg"></div></div>
    <div class="list" id="jobList"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <p class="muted small" id="jobFoot"></p>
  </section>

  <section class="page" id="pg-apps">
    <div class="page-head">
      <div><h1>Applications</h1><p class="sub" id="appsSub"></p></div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="checkGmail"></button>
        <button class="btn primary" id="addApp"><svg><use href="#i-plus"/></svg>Add</button>
      </div>
    </div>
    <div id="review"></div>
    <div class="toolbar">
      <div class="search"><svg><use href="#i-search"/></svg><input id="aq" placeholder="Search applications" autocomplete="off"><kbd>/</kbd></div>
      <div class="seg" id="appSeg"></div>
    </div>
    <div class="list" id="appList"><div class="skel"></div><div class="skel"></div></div>
  </section>

  <section class="page" id="pg-live">
    <div class="page-head">
      <div><h1>Live search</h1><p class="sub" id="liveSub">Watch the job search and Gmail check as they run.</p></div>
      <button class="btn primary" id="runSearch"></button>
    </div>
    <div id="liveBody"></div>
  </section>

  <section class="page" id="pg-docs">
    <div class="page-head">
      <div><h1>Documents</h1><p class="sub">Tailored CVs and cover letters. Every fact comes from your master CV; numbers are checked.</p></div>
      <button class="btn primary" id="newTailor"><svg><use href="#i-spark"/></svg>Tailor for a role</button>
    </div>
    <div id="docsBody"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Application details"></aside>
<div class="studio" id="studio"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toasts" id="toasts"></div>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8Z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M4 4v4h4M20 20v-4h-4"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></symbol>
</svg>
<script src="/static/app.js"></script>
</body>
</html>
